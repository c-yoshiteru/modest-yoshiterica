<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5つの四面体：すきまは歪みで閉じる</title>
<style>
:root{--bg:#fff;--fg:#2c2c2a;--text-secondary:#5f5e5a;--text-muted:#888780;--border-strong:#888780;--surface-1:#f1efe8;--radius:8px}
@media(prefers-color-scheme:dark){:root{--bg:#1f1e1d;--fg:#f1efe8;--text-secondary:#b4b2a9;--surface-1:#2c2c2a}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:480px;margin-inline:auto}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
button{height:36px;min-width:44px;padding:0 12px;border:1px solid var(--border-strong);background:transparent;color:var(--fg);border-radius:8px}
input[type=range]{width:100%}
</style></head><body>
<h1>5つの四面体：すきまは歪みで閉じる</h1>
<div style="display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary);">
  <span>歪み</span><input type="range" id="t" min="0" max="100" value="0" step="1"><span id="tv" style="min-width:64px;text-align:right;">なし</span>
</div>
<div style="display:flex;align-items:center;gap:8px;margin:8px 0;">
  <button id="play">再生</button>
  <button id="b0">歪みなし</button>
  <button id="b1">閉じる</button>
</div>
<canvas id="cv" width="380" height="320" style="width:100%;height:auto;display:block;"></canvas>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 0;">
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:10px;"><div style="font-size:12px;color:var(--text-secondary);">1個ぶんの角</div><div style="font-size:18px;font-weight:500;" id="al">70.53°</div></div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:10px;"><div style="font-size:12px;color:var(--text-secondary);">すきま</div><div style="font-size:18px;font-weight:500;" id="gp">7.36°</div></div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:10px;"><div style="font-size:12px;color:var(--text-secondary);">角度の歪み</div><div style="font-size:18px;font-weight:500;" id="st">0.0%</div></div>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:8px 0 0;">辺（紙面に垂直）のまわりに、5個の四面体を並べた断面の模式図。5 × 1個ぶんの角 + すきま = 360°。</p>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),T=document.getElementById('t'),playing=false,dir=1;
var A0=Math.acos(1/3)*180/Math.PI;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function rad(d){return d*Math.PI/180;}
function draw(){
  var t=T.value/100,al=A0+t*(72-A0),gap=360-5*al;
  document.getElementById('al').textContent=al.toFixed(2)+'°';
  document.getElementById('gp').textContent=gap.toFixed(2)+'°';
  document.getElementById('st').textContent=((al/A0-1)*100).toFixed(1)+'%';
  document.getElementById('tv').textContent=t<0.01?'なし':(t>0.99?'閉じた':Math.round(t*100)+'%');
  var W=cv.width,H=cv.height,cx=190,cy=150,R=125,txt=css('--text-secondary');
  ctx.clearRect(0,0,W,H);
  var cols=['#EF9F27','#F5C46B','#EF9F27','#F5C46B','#EF9F27'];
  function pt(a,r){return [cx+(r||R)*Math.cos(rad(a)),cy-(r||R)*Math.sin(rad(a))];}
  for(var i=0;i<5;i++){
    var a0=90-i*al,a1=90-(i+1)*al,p0=pt(a0),p1=pt(a1);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.closePath();
    ctx.fillStyle=cols[i];ctx.fill();ctx.strokeStyle='#854F0B';ctx.lineWidth=1.5;ctx.stroke();
    var m=pt((a0+a1)/2,R*0.6);ctx.fillStyle='#412402';ctx.font='15px sans-serif';ctx.fillText(String(i+1),m[0]-4,m[1]+5);
  }
  if(gap>0.05){
    var as=90-5*al,q=pt(as),q2=pt(90);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(q[0],q[1]);ctx.lineTo(q2[0],q2[1]);ctx.closePath();
    ctx.fillStyle='rgba(216,90,48,0.75)';ctx.fill();ctx.strokeStyle='#D85A30';ctx.lineWidth=1.5;ctx.stroke();
    var g=pt((as+90)/2,R*1.1);ctx.fillStyle='#D85A30';ctx.font='13px sans-serif';ctx.fillText('すきま',g[0]-16,g[1]-2);
  }
  ctx.beginPath();ctx.arc(cx,cy,4,0,6.2832);ctx.fillStyle='#412402';ctx.fill();
  ctx.fillStyle=txt;ctx.font='12px sans-serif';ctx.fillText('中心＝5つが共有する辺（紙面に垂直）',8,H-8);
}
T.addEventListener('input',draw);
document.getElementById('b0').addEventListener('click',function(){T.value=0;draw();});
document.getElementById('b1').addEventListener('click',function(){T.value=100;draw();});
var pb=document.getElementById('play');
function loop(){if(!playing)return;var v=+T.value+dir*0.5;if(v>=100){v=100;dir=-1;}if(v<=0){v=0;dir=1;}T.value=v;draw();requestAnimationFrame(loop);}
pb.addEventListener('click',function(){playing=!playing;pb.textContent=playing?'停止':'再生';if(playing)requestAnimationFrame(loop);});
draw();
</script></body></html>
