<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple to Tetrahedron - Phase Shift</title>
  <style>
    body {
      margin: 0;
      background-color: #030508;
      color: #e0e0e0;
      font-family: sans-serif;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      line-height: 1.6;
      background: rgba(3, 5, 8, 0.85);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 100, 100, 0.3);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <div id="info">
    <strong>旋回せよ (Drag to Rotate)</strong><br>
    【正面】 有機的な意味・象徴の具現：りんご<br>
    【裏面】 無機的な絶対構造：正四面体
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 点の総数
    const slices = 60;
    const stacks = 60;
    const particleCount = slices * stacks;

    // --- 1. りんご（表：有機的な意味）の座標生成 ---
    const applePoints = [];
    const appleColors = [];

    for (let i = 0; i < slices; i++) {
      const u = (i / slices) * Math.PI * 2; // 0 〜 2π
      for (let j = 0; j < stacks; j++) {
        const v = (j / stacks) * Math.PI - (Math.PI / 2); // -π/2 〜 π/2

        // 心臓形（カディオイド）を回転させたシンプルな球面りんご数式
        const r = 1.6 * (1 - Math.sin(v));
        const x = r * Math.cos(v) * Math.sin(u) * 0.8;
        const y = r * Math.sin(v) * 0.8 + 0.5; // 位置の調整
        const z = r * Math.cos(v) * Math.cos(u) * 0.8;

        applePoints.push(new THREE.Vector3(x, y, z));

        // 色：赤〜黄のグラデーション
        const rColor = 0.9 + Math.sin(v) * 0.1;
        const gColor = 0.1 + Math.cos(u) * 0.2;
        const bColor = 0.15;
        appleColors.push(rColor, gColor, bColor);
      }
    }

    // --- 2. 正四面体（裏：幾何学構造）の座標生成 ---
    const tetraGeo = new THREE.TetrahedronGeometry(2.0);
    const tetraPositions = tetraGeo.attributes.position.array;
    const tetraVertices = [];
    for (let i = 0; i < tetraPositions.length; i += 3) {
      tetraVertices.push(new THREE.Vector3(tetraPositions[i], tetraPositions[i+1], tetraPositions[i+2]));
    }

    const tetraPoints = [];
    for (let i = 0; i < particleCount; i++) {
      const faceIndex = i % 4;
      let vA, vB, vC;

      if (faceIndex === 0) { vA = tetraVertices[0]; vB = tetraVertices[1]; vC = tetraVertices[2]; }
      else if (faceIndex === 1) { vA = tetraVertices[0]; vB = tetraVertices[1]; vC = tetraVertices[3]; }
      else if (faceIndex === 2) { vA = tetraVertices[0]; vB = tetraVertices[2]; vC = tetraVertices[3]; }
      else { vA = tetraVertices[1]; vB = tetraVertices[2]; vC = tetraVertices[3]; }

      let r1 = Math.random();
      let r2 = Math.random();
      if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2; }

      const pt = new THREE.Vector3()
        .addScaledVector(vA, 1 - r1 - r2)
        .addScaledVector(vB, r1)
        .addScaledVector(vC, r2);

      tetraPoints.push(pt);
    }

    // --- パーティクルシステムの構築 ---
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3]     = applePoints[i].x;
      positions[i * 3 + 1] = applePoints[i].y;
      positions[i * 3 + 2] = applePoints[i].z;

      colors[i * 3]     = appleColors[i * 3];
      colors[i * 3 + 1] = appleColors[i * 3 + 1];
      colors[i * 3 + 2] = appleColors[i * 3 + 2];
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // --- ドラッグ操作 ---
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let targetRotationY = 0;
    let targetRotationX = 0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      targetRotationY += deltaX * 0.006;
      targetRotationX += deltaY * 0.006;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => isDragging = false);

    // --- アニメーション ---
    function animate() {
      requestAnimationFrame(animate);

      particleSystem.rotation.y += (targetRotationY - particleSystem.rotation.y) * 0.05;
      particleSystem.rotation.x += (targetRotationX - particleSystem.rotation.x) * 0.05;

      const angle = particleSystem.rotation.y;
      let flipFactor = (1 - Math.cos(angle)) / 2;

      const currentPos = geometry.attributes.position.array;
      const currentCol = geometry.attributes.color.array;

      for (let i = 0; i < particleCount; i++) {
        const appPt = applePoints[i];
        const tetPt = tetraPoints[i];

        currentPos[i * 3]     = THREE.MathUtils.lerp(appPt.x, tetPt.x, flipFactor);
        currentPos[i * 3 + 1] = THREE.MathUtils.lerp(appPt.y, tetPt.y, flipFactor);
        currentPos[i * 3 + 2] = THREE.MathUtils.lerp(appPt.z, tetPt.z, flipFactor);

        // 色の補間（赤〜黄から青緑〜白へ）
        currentCol[i * 3]     = THREE.MathUtils.lerp(appleColors[i * 3], 0.1, flipFactor);
        currentCol[i * 3 + 1] = THREE.MathUtils.lerp(appleColors[i * 3 + 1], 0.9, flipFactor);
        currentCol[i * 3 + 2] = THREE.MathUtils.lerp(appleColors[i * 3 + 2], 1.0, flipFactor);
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
