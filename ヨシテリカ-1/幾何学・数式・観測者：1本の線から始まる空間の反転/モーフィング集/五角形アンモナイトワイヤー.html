<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentagram to Ammonite - Pure Wireframe Gyre</title>
  <style>
    body {
      margin: 0;
      background-color: #020306;
      color: #e0e0e0;
      font-family: sans-serif;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      line-height: 1.6;
      background: rgba(2, 3, 6, 0.85);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    canvas { display: block; }
  </style>
</head>
<body>

  <div id="info">
    <strong>旋回せよ (Drag to Rotate)</strong><br>
    【正面】 黄金比の骨格：五角形と星形 (Pentagram Wire)<br>
    【裏面】 螺旋の位相：アンモナイト骨格 (Ammonite Wire)
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- 1. 基本パラメータ設定 ---
    const spiralTurns = 4.5;       // 螺旋の巻き数
    const stepsPerTurn = 40;       // 1周あたりの分割数（解像度）
    const totalRings = Math.floor(spiralTurns * stepsPerTurn);
    const tubeSides = 8;          // 断面（管）の角数（ワイヤーのシンプルさ重視）

    // 線の総数を算出 (各リング間の縦線 + リング自体の輪郭線)
    const totalLines = (totalRings - 1) * tubeSides + totalRings * tubeSides;

    // --- 2. 形状データの生成関数 ---

    // 五角形＋星形（表）のメッシュ頂点生成
    function createPentaMeshVertices() {
      const vertices = [];
      const basePenta = [];
      for (let i = 0; i < 5; i++) {
        const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
        basePenta.push(new THREE.Vector3(2.5 * Math.cos(angle), 2.5 * Math.sin(angle), 0));
      }
      const starOrder = [0, 2, 4, 1, 3, 0];

      // 螺旋の全頂点数に合わせて、五角形＋星形の線上へ均等補間配置
      const totalVerticesCount = totalRings * tubeSides;
      
      for (let i = 0; i < totalVerticesCount; i++) {
        const seg = i % 10;
        let pA, pB;
        if (seg < 5) {
          pA = basePenta[seg];
          pB = basePenta[(seg + 1) % 5];
        } else {
          const idx = seg - 5;
          pA = basePenta[starOrder[idx]];
          pB = basePenta[starOrder[idx + 1]];
        }
        const t = (i % 30) / 30; // 規則的な分散
        const pt = new THREE.Vector3().lerpVectors(pA, pB, t);
        // わずかな奥行き感を均等に与える
        pt.z = ((i % 5) - 2) * 0.05;
        vertices.push(pt);
      }
      return vertices;
    }

    // アンモナイト螺旋（裏）のメッシュ頂点生成
    function createAmmoniteMeshVertices() {
      const vertices = [];
      const a = 0.12;
      const b = 0.14;

      for (let r = 0; r < totalRings; r++) {
        const theta = (r / stepsPerTurn) * Math.PI * 2;
        const radius = a * Math.exp(b * theta);
        const tubeRadius = radius * 0.28;

        const centerX = radius * Math.cos(theta) - 1.2;
        const centerY = radius * Math.sin(theta);
        const centerZ = theta * 0.03;

        for (let s = 0; s < tubeSides; s++) {
          const phi = (s / tubeSides) * Math.PI * 2;
          
          // 断面の円運動
          const x = centerX + tubeRadius * Math.cos(phi) * Math.cos(theta);
          const y = centerY + tubeRadius * Math.cos(phi) * Math.sin(theta);
          const z = centerZ + tubeRadius * Math.sin(phi);

          vertices.push(new THREE.Vector3(x, y, z));
        }
      }
      return vertices;
    }

    const pentaVertices = createPentaMeshVertices();
    const ammoniteVertices = createAmmoniteMeshVertices();
    const vertexCount = ammoniteVertices.length;

    // --- 3. ワイヤーフレーム（LineSegments）構造構築 ---
    const linePositions = new Float32Array(totalLines * 2 * 3);
    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0xffd700,
      transparent: true,
      opacity: 0.75,
      linewidth: 1.5
    });

    const wireframeMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(wireframeMesh);

    // インタラクション
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let targetRotationY = 0;
    let targetRotationX = 0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      targetRotationY += deltaX * 0.008;
      targetRotationX += deltaY * 0.008;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => isDragging = false);

    // --- 4. アニメーション（位相変容ループ） ---
    let autoRotateAngle = 0;

    function animate() {
      requestAnimationFrame(animate);

      // 無限旋回（自転）
      autoRotateAngle += 0.0025;

      wireframeMesh.rotation.y += (targetRotationY + autoRotateAngle - wireframeMesh.rotation.y) * 0.05;
      wireframeMesh.rotation.x += (targetRotationX - wireframeMesh.rotation.x) * 0.05;

      const angle = wireframeMesh.rotation.y;
      let flipFactor = (1 - Math.cos(angle)) / 2; // 0.0 〜 1.0 (位相の反転率)

      // 頂点座標の動的ブレンド
      const currentVertices = [];
      for (let i = 0; i < vertexCount; i++) {
        const pPt = pentaVertices[i];
        const aPt = ammoniteVertices[i];

        const x = THREE.MathUtils.lerp(pPt.x, aPt.x, flipFactor);
        const y = THREE.MathUtils.lerp(pPt.y, aPt.y, flipFactor);
        const z = THREE.MathUtils.lerp(pPt.z, aPt.z, flipFactor);

        currentVertices.push(new THREE.Vector3(x, y, z));
      }

      // ワイヤーのラインデータ更新（リング間接続 ＋ 環状接続）
      const posArray = lineGeometry.attributes.position.array;
      let lineIdx = 0;

      function setLineSegment(p1, p2) {
        posArray[lineIdx * 6]     = p1.x;
        posArray[lineIdx * 6 + 1] = p1.y;
        posArray[lineIdx * 6 + 2] = p1.z;

        posArray[lineIdx * 6 + 3] = p2.x;
        posArray[lineIdx * 6 + 4] = p2.y;
        posArray[lineIdx * 6 + 5] = p2.z;
        lineIdx++;
      }

      for (let r = 0; r < totalRings; r++) {
        for (let s = 0; s < tubeSides; s++) {
          const currIdx = r * tubeSides + s;
          const nextSideIdx = r * tubeSides + ((s + 1) % tubeSides);

          // 1. 断面の環状ワイヤー
          setLineSegment(currentVertices[currIdx], currentVertices[nextSideIdx]);

          // 2. 螺旋方向の縦ワイヤー
          if (r < totalRings - 1) {
            const nextRingIdx = (r + 1) * tubeSides + s;
            setLineSegment(currentVertices[currIdx], currentVertices[nextRingIdx]);
          }
        }
      }

      lineGeometry.attributes.position.needsUpdate = true;

      // 色彩の移り変わり（黄金の正五角形 ⇔ 碧く輝く太古のアンモナイト）
      lineMaterial.color.setHSL(
        0.12 * (1 - flipFactor) + 0.52 * flipFactor,
        0.9,
        0.5 + flipFactor * 0.1
      );

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
