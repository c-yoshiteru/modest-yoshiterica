<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere-Line Phase Transformation</title>
  <style>
    body {
      margin: 0;
      background-color: #010204;
      color: #e0e0e0;
      font-family: sans-serif;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      line-height: 1.6;
      background: rgba(1, 2, 4, 0.85);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 200, 0.2);
    }
    canvas { display: block; }
  </style>
</head>
<body>

  <div id="info">
    <strong>旋回せよ (Drag to Rotate)</strong><br>
    【正面】 球線構造 (Spherical Wireframe)<br>
    【裏面】 線形収束：正四面体 (Tetrahedron)
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 点と線の定義
    const latitudeBands = 12;  // 緯度
    const longitudeBands = 12; // 経度
    const sphereNodes = [];
    const sphereEdges = [];

    // 1. 球面のノード（ドット）生成
    for (let lat = 0; lat <= latitudeBands; lat++) {
      const theta = (lat * Math.PI) / latitudeBands; // 0 〜 π
      const sinTheta = Math.sin(theta);
      const cosTheta = Math.cos(theta);

      for (let lon = 0; lon <= longitudeBands; lon++) {
        const phi = (lon * 2 * Math.PI) / longitudeBands; // 0 〜 2π
        const x = 2.0 * sinTheta * Math.cos(phi);
        const y = 2.0 * cosTheta;
        const z = 2.0 * sinTheta * Math.sin(phi);

        sphereNodes.push(new THREE.Vector3(x, y, z));
      }
    }

    // 球面の接続線（エッジ）生成
    for (let lat = 0; lat < latitudeBands; lat++) {
      for (let lon = 0; lon < longitudeBands; lon++) {
        const first = lat * (longitudeBands + 1) + lon;
        const second = first + longitudeBands + 1;

        sphereEdges.push([first, first + 1]);
        sphereEdges.push([first, second]);
      }
    }

    const nodeCount = sphereNodes.length;
    const edgeCount = sphereEdges.length;

    // 2. 正四面体側のノード生成（球面の点数を4頂点に均等マッピング）
    const tetraGeo = new THREE.TetrahedronGeometry(2.2);
    const tetraPositions = tetraGeo.attributes.position.array;
    const tetraVertices = [];
    for (let i = 0; i < tetraPositions.length; i += 3) {
      tetraVertices.push(new THREE.Vector3(tetraPositions[i], tetraPositions[i+1], tetraPositions[i+2]));
    }

    const tetraNodes = sphereNodes.map((_, i) => tetraVertices[i % 4]);

    // 3. 描画オブジェクト構築
    const dotGeometry = new THREE.BufferGeometry();
    const dotPositions = new Float32Array(nodeCount * 3);
    dotGeometry.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));

    const dotMaterial = new THREE.PointsMaterial({
      color: 0x00ffcc,
      size: 0.08,
      transparent: true,
      opacity: 0.9
    });
    const dots = new THREE.Points(dotGeometry, dotMaterial);
    scene.add(dots);

    const linePositions = new Float32Array(edgeCount * 2 * 3);
    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0x00ffcc,
      transparent: true,
      opacity: 0.4
    });
    const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lines);

    // インタラクション
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let targetRotationY = 0;
    let targetRotationX = 0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      targetRotationY += deltaX * 0.008;
      targetRotationX += deltaY * 0.008;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => isDragging = false);

    // アニメーション
    function animate() {
      requestAnimationFrame(animate);

      dots.rotation.y += (targetRotationY - dots.rotation.y) * 0.05;
      dots.rotation.x += (targetRotationX - dots.rotation.x) * 0.05;
      lines.rotation.copy(dots.rotation);

      const angle = dots.rotation.y;
      let flipFactor = (1 - Math.cos(angle)) / 2;

      const currentDotPos = dotGeometry.attributes.position.array;
      const currentLinePos = lineGeometry.attributes.position.array;

      const interpolatedNodes = [];
      for (let i = 0; i < nodeCount; i++) {
        const sPt = sphereNodes[i];
        const tPt = tetraNodes[i];

        const x = THREE.MathUtils.lerp(sPt.x, tPt.x, flipFactor);
        const y = THREE.MathUtils.lerp(sPt.y, tPt.y, flipFactor);
        const z = THREE.MathUtils.lerp(sPt.z, tPt.z, flipFactor);

        interpolatedNodes.push(new THREE.Vector3(x, y, z));

        currentDotPos[i * 3]     = x;
        currentDotPos[i * 3 + 1] = y;
        currentDotPos[i * 3 + 2] = z;
      }

      for (let i = 0; i < edgeCount; i++) {
        const edge = sphereEdges[i];
        const p1 = interpolatedNodes[edge[0]];
        const p2 = interpolatedNodes[edge[1]];

        currentLinePos[i * 6]     = p1.x;
        currentLinePos[i * 6 + 1] = p1.y;
        currentLinePos[i * 6 + 2] = p1.z;

        currentLinePos[i * 6 + 3] = p2.x;
        currentLinePos[i * 6 + 4] = p2.y;
        currentLinePos[i * 6 + 5] = p2.z;
      }

      dotGeometry.attributes.position.needsUpdate = true;
      lineGeometry.attributes.position.needsUpdate = true;

      // 色の移り変わり（緑・青から、白・バイオレットへ）
      dotMaterial.color.setHSL(0.45 * (1 - flipFactor) + 0.7 * flipFactor, 1.0, 0.5 + flipFactor * 0.4);
      lineMaterial.color.copy(dotMaterial.color);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
